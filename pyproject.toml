[project]
name = "railtrace"
version = "0.1.0"
description = "Railtrace backend: FastAPI + SQLAlchemy + PostgreSQL"
readme = "README.md"
authors = [
    { name = "denys" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
railtrace = "app.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
