services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-railtrace}
      POSTGRES_USER: ${DB_USER:-railtrace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-railtrace}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-railtrace}
      DB_URL: postgresql+psycopg://${DB_USER:-railtrace}:${DB_PASSWORD:-railtrace}@db:5432/${DB_NAME:-railtrace}
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
