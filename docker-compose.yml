# Configuração partilhada pelos serviços que usam a imagem do backend (api, init, cli)
x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: railtrace-backend
  environment:
    DB_HOST: db
    DB_NAME: ${DB_NAME:-railtrace}
    DB_URL: postgresql+psycopg://${DB_USER:-railtrace}:${DB_PASSWORD:-railtrace}@db:5432/${DB_NAME:-railtrace}
    API_PORT: ${API_PORT:-8000}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-railtrace}
      POSTGRES_USER: ${DB_USER:-railtrace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-railtrace}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && railtrace seed --file data/seed.json"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  # Só corre com: docker compose run --rm cli <comando>
  cli:
    <<: *backend
    profiles: ["cli"]
    entrypoint: ["railtrace"]
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
